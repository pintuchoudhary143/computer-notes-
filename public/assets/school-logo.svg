<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="parchmentBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fffef9" />
      <stop offset="65%" stop-color="#fdf4e7" />
      <stop offset="100%" stop-color="#f5e0c3" />
    </radialGradient>

    <!-- Outer Red Border Gradient -->
    <linearGradient id="redBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5221f" />
      <stop offset="50%" stop-color="#b31b1b" />
      <stop offset="100%" stop-color="#941212" />
    </linearGradient>

    <!-- Diya Flame Radial Gradient -->
    <radialGradient id="flameInner" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Text Path for Top Arc: सा विद्या या विमुक्तये -->
    <!-- Center of arc is approx (160, 150), radius 98 -->
    <path id="topTextArc" d="M 62,168 A 102,102 0 0,1 258,168" fill="none" />

    <!-- Text Path for Bottom Arc: विद्या भारती -->
    <path id="bottomTextArc" d="M 80,332 Q 160,378 240,332" fill="none" />

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" flood-color="#000" />
    </filter>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Shield Body: Arch Top, Straight Sides, Curved Rounded Bottom -->
  <g filter="url(#shadow)">
    <!-- Outer Red Crimson Rim -->
    <path
      d="M 52,145 A 108,108 0 0,1 268,145 L 268,310 Q 268,375 160,375 Q 52,375 52,310 Z"
      fill="url(#redBorderGrad)"
    />

    <!-- Inner Parchment Cream Background -->
    <path
      d="M 64,147 A 96,96 0 0,1 256,147 L 256,305 Q 256,363 160,363 Q 64,363 64,305 Z"
      fill="url(#parchmentBg)"
    />
  </g>

  <!-- Inner Fine Red Accent Ring -->
  <path
    d="M 67,148 A 93,93 0 0,1 253,148 L 253,303 Q 253,359 160,359 Q 67,359 67,303 Z"
    fill="none"
    stroke="#d94542"
    stroke-width="1.5"
    opacity="0.6"
  />

  <!-- Top Sacred Mantra: "सा विद्या या विमुक्तये" -->
  <text font-family="'Mukta', 'Noto Sans Devanagari', 'Devanagari MT', sans-serif" font-weight="900" font-size="20.5" fill="#18181b">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      सा विद्या या विमुक्तये
    </textPath>
  </text>

  <!-- Center Artwork: Book (Pustak) + Deepak (Diya) + Sacred Flame (Jyoti) -->
  <g id="centerEmblem" transform="translate(0, 0)">
    
    <!-- 1. Open Book / Scripture (2.5D Perspective) -->
    <!-- Book Shadow -->
    <ellipse cx="160" cy="288" rx="66" ry="12" fill="#000000" opacity="0.18" />

    <!-- Book Base / Pages Bottom -->
    <polygon points="100,240 160,268 220,240 220,256 160,284 100,256" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Book Front Spine / Pages Edge (with 2 blue ribbon markers) -->
    <polygon points="100,256 160,284 160,268 100,240" fill="#f8fafc" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />
    <polygon points="160,284 220,256 220,240 160,268" fill="#f1f5f9" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />

    <!-- Blue ribbons/decorations on the front pages as in logo -->
    <polygon points="116,248 132,255 132,268 116,260" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.5" />
    <polygon points="138,258 154,265 154,278 138,270" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.5" />
    <!-- White spine gap -->
    <line x1="160" y1="268" x2="160" y2="284" stroke="#0f172a" stroke-width="2.5" />

    <!-- Book Top Surface (Open white pages) -->
    <polygon points="100,240 160,222 220,240 160,268" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Center fold / spine seam on top page -->
    <line x1="160" y1="223" x2="160" y2="267" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2" />

    <!-- 2. The Traditional Earthen Diya (Deepak) -->
    <!-- Diya Shadow on Book -->
    <ellipse cx="160" cy="246" rx="32" ry="9" fill="#000000" opacity="0.3" />

    <!-- Diya Black Clay Vessel -->
    <ellipse cx="160" cy="235" rx="30" ry="18" fill="#18181b" stroke="#09090b" stroke-width="2" />
    
    <!-- Diya Rim and Inner Glow -->
    <ellipse cx="160" cy="230" rx="25" ry="12" fill="#27272a" stroke="#d97706" stroke-width="2" />
    <ellipse cx="160" cy="229" rx="20" ry="9" fill="#78350f" />
    <ellipse cx="160" cy="228" rx="14" ry="6" fill="#b45309" />

    <!-- 3. The Sacred Akhand Jyoti (Flame) -->
    <!-- Outer Warm Aura -->
    <ellipse cx="160" cy="180" rx="26" ry="42" fill="#ea580c" opacity="0.18" filter="url(#flameGlow)" />
    
    <!-- Outer Flame Petal -->
    <path
      d="M 160,110 
         C 174,135 186,160 184,185 
         C 182,210 172,226 160,227 
         C 148,226 138,210 136,185 
         C 134,160 146,135 160,110 Z"
      fill="url(#flameOuter)"
      stroke="#b45309"
      stroke-width="1.5"
      filter="url(#flameGlow)"
    />

    <!-- Mid Flame Layer -->
    <path
      d="M 160,128 
         C 170,148 178,168 176,188 
         C 174,208 168,222 160,224 
         C 152,222 146,208 144,188 
         C 142,168 150,148 160,128 Z"
      fill="url(#flameInner)"
    />

    <!-- Inner Core White-Hot Flame -->
    <path
      d="M 160,150 
         C 165,165 170,180 168,195 
         C 166,210 163,218 160,220 
         C 157,218 154,210 152,195 
         C 150,180 155,165 160,150 Z"
      fill="#ffffff"
      opacity="0.95"
    />
  </g>

  <!-- Bottom Sacred Name: "विद्या भारती" -->
  <text font-family="'Mukta', 'Noto Sans Devanagari', 'Devanagari MT', sans-serif" font-weight="900" font-size="25" fill="#18181b">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      विद्या भारती
    </textPath>
  </text>
</svg>
